name: CI

on:
  push:
    branches: [main, nhl-draft-final-2026-09-26]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
