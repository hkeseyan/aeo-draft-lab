name: CI

on:
  push:
    branches: [main, nhl-draft-final-2026-09-26]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Verify production auto-deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          for attempt in $(seq 1 24); do
            html="$(curl -fsS --max-time 15 https://aeo-draft-lab.hkeseyan.workers.dev/ || true)"
            if printf '%s' "$html" | grep -q 'Schedule and usable games' \
              && printf '%s' "$html" | grep -q 'Pending Yahoo trade offers' \
              && printf '%s' "$html" | grep -q '/api/yahoo/pending-trades' \
              && printf '%s' "$html" | grep -q 'Roster first: schedules, usable games and drop choices' \
              && printf '%s' "$html" | grep -q 'Priority long-term adds' \
              && printf '%s' "$html" | grep -q 'Drop candidates: fewest usable games first' \
              && printf '%s' "$html" | grep -q 'Exposure across your other drafted leagues in this sport' \
              && printf '%s' "$html" | grep -q "Yahoo Public Prize NHL — H2H Points (12-team reference)" \
              && printf '%s' "$html" | grep -q "yahoo-nhl-public-categories" \
              && printf '%s' "$html" | grep -q "officialDraft:true" \
              && ! printf '%s' "$html" | grep -q '\.fchip'; then
              echo "Production Worker matches latest deployed feature markers."
              exit 0
            fi
            echo "Waiting for Cloudflare Workers Build auto-deploy (attempt $attempt/24)..."
            sleep 5
          done
          echo "Production Worker did not converge to the merged main build in time."
          exit 1

      - name: Verify deployed MCP OAuth discovery and authorization boundary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          base="https://aeo-draft-lab.hkeseyan.workers.dev"
          for attempt in $(seq 1 24); do
            auth="$(curl -fsS --max-time 15 "$base/.well-known/oauth-authorization-server" || true)"
            resource="$(curl -fsS --max-time 15 "$base/.well-known/oauth-protected-resource/mcp" || true)"
            if printf '%s' "$auth" | jq -e --arg base "$base" '.issuer == $base and .client_id_metadata_document_supported == true and (.code_challenge_methods_supported | index("S256"))' >/dev/null 2>&1 \
              && printf '%s' "$resource" | jq -e --arg target "$base/mcp" '.resource == $target' >/dev/null 2>&1; then
              code="$(curl -sS --max-time 15 -o /tmp/mcp-unauthorized-body -D /tmp/mcp-unauthorized-headers -w '%{http_code}' \
                -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$base/mcp")"
              test "$code" = "401"
              grep -iq 'www-authenticate: Bearer' /tmp/mcp-unauthorized-headers
              echo "OAuth discovery works; private MCP tools correctly require authorization."
              exit 0
            fi
            echo "Waiting for deployed MCP OAuth routes (attempt $attempt/24)"
            sleep 5
          done
          echo "Deployed MCP OAuth discovery not ready"
          exit 1
