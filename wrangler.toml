name = "aeo-draft-lab"
main = "worker.js"
compatibility_date = "2025-01-01"

# Run at both UTC hours that can correspond to 1:00am Pacific. The Worker
# checks America/Los_Angeles local time and an idempotency key, so exactly one
# report is produced through both daylight- and standard-time weeks.
[triggers]
crons = ["0 8,9 * * 2"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV namespace for cross-device mock draft history (bound as env.MOCKS in worker.js).
[[kv_namespaces]]
binding = "MOCKS"
id = "1d439dfe62f1412da95101491c170cef"

# Optional: restrict mock history to a single shared secret.
# Set with `npx wrangler secret put AUTH_TOKEN` (do not put real secrets in this file).
# [vars]
# AUTH_TOKEN = ""
